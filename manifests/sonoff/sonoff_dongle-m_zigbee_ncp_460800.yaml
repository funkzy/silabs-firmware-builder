name: SONOFF Dongle-M Zigbee NCP (460800, no flow control)
device: EFR32MG24A420F1536IM48
base_project: src/zigbee_ncp
filename: "{manifest_name}_{ezsp_version}_{baudrate}_{fw_variant}"
sdk: "simplicity_sdk:2025.6.2"
toolchain: "12.2.1.20221205"

gbl:
  fw_type: zigbee_ncp
  ezsp_version: dynamic
  baudrate: 460800
  fw_variant: no_flow

configuration:
  # A trust centre that keeps a unique link key per device (a network migrated from Z-Stack
  # brings its own per-device keys; EmberZNet cannot re-derive them and can only hold them
  # as key-table entries).  254 is the stack maximum since EmberZNet 8.1 (release notes
  # 1342410/1342412; the token-factory-reset watchdog trip at >=120 entries, 1352533, is
  # fixed in 8.1 rev 2 / 1402930).  Silicon Labs' large-network guidance (8.1 notes §7):
  # key table = network size, NVM3 64K instead of the 32K sample default, a bigger NVM3
  # cache.  NVM3 grows from 4 to 8 flash pages at the top of the 1536 KB part.
  SL_ZIGBEE_KEY_TABLE_SIZE: 254
  NVM3_DEFAULT_NVM_SIZE: 65536
  NVM3_DEFAULT_CACHE_SIZE: 600

c_defines:
  SL_IOSTREAM_EUSART_VCOM_BAUDRATE: 460800
  SL_IOSTREAM_EUSART_VCOM_FLOW_CONTROL_TYPE: SL_IOSTREAM_EUSART_UART_FLOW_CTRL_NONE
  # 460800 without flow control: larger RX buffer (Nabu Casa ZBT-2 uses 512 at 460800)
  SL_IOSTREAM_EUSART_VCOM_RX_BUFFER_SIZE: 512

  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL: EUSART1
  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL_NO: 1

  SL_IOSTREAM_EUSART_VCOM_TX_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_EUSART_VCOM_TX_PIN: 1

  SL_IOSTREAM_EUSART_VCOM_RX_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_EUSART_VCOM_RX_PIN: 2

  SL_IOSTREAM_EUSART_VCOM_CTS_PORT: 0
  SL_IOSTREAM_EUSART_VCOM_CTS_PIN: 0

  SL_IOSTREAM_EUSART_VCOM_RTS_PORT: 0
  SL_IOSTREAM_EUSART_VCOM_RTS_PIN: 0

  SL_CLOCK_MANAGER_HFXO_EN: 1
  SL_CLOCK_MANAGER_HFXO_CTUNE: 100
  SL_CLOCK_MANAGER_HFXO_FREQ: 38400000
  SL_CLOCK_MANAGER_HFXO_PRECISION: 10
  SL_CLOCK_MANAGER_DEFAULT_HF_CLOCK_SOURCE: SL_CLOCK_MANAGER_DEFAULT_HF_CLOCK_SOURCE_HFXO

  SL_RAIL_UTIL_RSSI_OFFSET: 0
